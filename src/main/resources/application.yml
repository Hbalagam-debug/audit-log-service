spring:
  application:
    name: audit-log-service
  profiles:
    default: sqlite
  sql:
    init:
      mode: never

logging:
  level:
    com.auditlog.service: INFO

audit:
  retention:
    window-days: 90
    default-dry-run: true
    require-approval: true
  redaction:
    require-approval: true
    mask-value: '[REDACTED]'
    allow-list: /ipAddress,/deviceId,/accountNumber,/personalIdentifier
