spring:
  application:
    name: audit-log-service
  profiles:
    default: sqlite
  sql:
    init:
      mode: never

logging:
  level:
    com.auditlog.service: INFO

audit:
  retention:
    window-days: 90
    default-dry-run: true
    require-approval: true
  redaction:
    require-approval: true
    mask-value: '[REDACTED]'
    allow-list: /ipAddress,/deviceId,/device/id,/accountNumber,/personalIdentifier
  encryption:
    enabled: true
    format-version: enc-v1
    algorithm: AES-256-GCM
    sensitive-pointers: /accountNumber,/personalIdentifier
    master-key-base64: ${AUDIT_ENCRYPTION_MASTER_KEY_BASE64:}
  export:
    max-records: 10000
    signing:
      enabled: true
      algorithm: Ed25519
      key-id: export-key-2026-01
      private-key-base64: ${AUDIT_EXPORT_SIGNING_PRIVATE_KEY_BASE64:}
      public-key-base64: ${AUDIT_EXPORT_SIGNING_PUBLIC_KEY_BASE64:}
