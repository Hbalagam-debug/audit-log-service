spring:
  application:
    name: audit-log-service
  profiles:
    default: sqlite
  sql:
    init:
      mode: never

logging:
  level:
    com.auditlog.service: INFO

audit:
  retention:
    window-days: 90
    default-dry-run: true
    require-approval: true
  redaction:
    require-approval: true
    mask-value: '[REDACTED]'
    allow-list: /ipAddress,/deviceId,/device/id,/accountNumber,/personalIdentifier
  encryption:
    enabled: true
    format-version: enc-v1
    algorithm: AES-256-GCM
    sensitive-pointers: /accountNumber,/personalIdentifier
    # Dev fallback (32 zero bytes). Override in production with AUDIT_ENCRYPTION_MASTER_KEY_BASE64.
    master-key-base64: ${AUDIT_ENCRYPTION_MASTER_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  export:
    max-records: 10000
    signing:
      enabled: ${AUDIT_EXPORT_SIGNING_ENABLED:false}
      algorithm: Ed25519
      key-id: ${AUDIT_EXPORT_SIGNING_KEY_ID:}
      private-key-file: ${AUDIT_EXPORT_SIGNING_PRIVATE_KEY_FILE:}
      private-key-base64: ${AUDIT_EXPORT_SIGNING_PRIVATE_KEY_BASE64:}
      public-key-file: ${AUDIT_EXPORT_SIGNING_PUBLIC_KEY_FILE:}
      public-key-base64: ${AUDIT_EXPORT_SIGNING_PUBLIC_KEY_BASE64:}
