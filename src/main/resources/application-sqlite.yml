spring:
  config:
    activate:
      on-profile: sqlite
  datasource:
    url: ${AUDIT_DB_URL:jdbc:sqlite:./data/audit-log.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health
